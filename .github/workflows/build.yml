<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Top Spinner Battle Arena</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0f17;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }

        /* TOP BAR */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .currency-card {
            background: rgba(20, 24, 38, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-icon {
            background: rgba(20, 24, 38, 0.85);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        /* MENU SCREEN */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 20, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00d2ff;
            color: #00d2ff;
            text-align: center;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
        }
        .btn-main {
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            border: none;
            color: #fff;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }
        .btn-main:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #3a3f58, #222638);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* MODE SELECT */
        .option-group {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }
        .opt-btn {
            background: #1e2338;
            border: 1px solid #3b4366;
            color: #8a94b8;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }
        .opt-btn.active {
            background: #0066ff;
            color: #fff;
            border-color: #00d2ff;
            font-weight: bold;
        }

        /* GARAGE SCREEN */
        .garage-container {
            display: flex;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            background: #141826;
            border-radius: 16px;
            border: 1px solid #2d3550;
            overflow: hidden;
        }
        .garage-left {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d3550;
        }
        .garage-right {
            flex: 1.2;
            padding: 20px;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .stat-bar-container {
            margin-bottom: 12px;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #a0aabf;
        }
        .stat-bar {
            height: 8px;
            background: #0d0f17;
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #0066ff);
            width: 0%;
            transition: width 0.3s ease;
        }
        .part-category {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .cat-btn {
            flex: 1;
            padding: 8px 0;
            background: #1d2235;
            border: 1px solid #2d3550;
            color: #8a94b8;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .cat-btn.active {
            background: #00d2ff;
            color: #000;
            font-weight: bold;
        }
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .part-card {
            background: #1d2235;
            border: 2px solid #2d3550;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .part-card.equipped {
            border-color: #00d2ff;
            background: #192d42;
        }
        .part-card .rarity {
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 4px;
        }
        .rarity-common { color: #aaa; }
        .rarity-rare { color: #00d2ff; }
        .rarity-epic { color: #a335ee; }
        .rarity-legendary { color: #ff8000; }

        /* SHOP / GACHA */
        .gacha-box {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .gacha-card {
            background: #1d2235;
            border: 1px solid #2d3550;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 200px;
        }

        /* IN-GAME HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .player-stamina-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: rgba(15, 18, 28, 0.8);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .stamina-bar {
            height: 12px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
        }
        .stamina-fill {
            height: 100%;
            background: #00ff88;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* JOYSTICK & BOOST */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(0, 210, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .btn-boost {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.5);
            cursor: pointer;
            pointer-events: auto;
        }
        .btn-boost:active {
            transform: scale(0.92);
        }

        /* LAUNCH GAUGE */
        .launch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .gauge-bg {
            width: 300px;
            height: 24px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #fff;
            margin: 20px 0;
            position: relative;
        }
        .gauge-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #ffea00, #ff0055);
        }

        /* RESULT SCREEN */
        .result-box {
            background: #141826;
            border: 1px solid #2d3550;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 320px;
        }
        .rank-title {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <!-- TOP BAR -->
        <div class="top-bar interactive">
            <div class="currency-card">
                🪙 <span id="gold-display">1000</span> Gold
            </div>
            <button class="btn-icon" id="sound-toggle">🔊 Sound ON</button>
        </div>

        <!-- MAIN MENU -->
        <div id="screen-main" class="screen interactive">
            <h1>SPINNER 3D</h1>
            
            <div style="margin-bottom: 15px; text-align: center;">
                <label style="font-size: 0.9rem; color:#aaa;">게임 모드</label>
                <div class="option-group">
                    <button class="opt-btn active" id="mode-1v1" onclick="setMode('1v1')">1 대 1</button>
                    <button class="opt-btn" id="mode-4p" onclick="setMode('4p')">4인 배틀</button>
                    <button class="opt-btn" id="mode-boss" onclick="setMode('boss')">보스전</button>
                </div>
            </div>

            <div style="margin-bottom: 20px; text-align: center;">
                <label style="font-size: 0.9rem; color:#aaa;">난이도</label>
                <div class="option-group">
                    <button class="opt-btn" id="diff-easy" onclick="setDiff('easy')">쉬움</button>
                    <button class="opt-btn active" id="diff-normal" onclick="setDiff('normal')">보통</button>
                    <button class="opt-btn" id="diff-hard" onclick="setDiff('hard')">어려움</button>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="btn-main" onclick="startBattle()">배틀 시작</button>
                <button class="btn-main btn-secondary" onclick="openScreen('screen-garage')">차고 (커스텀)</button>
                <button class="btn-main btn-secondary" onclick="openScreen('screen-shop')">상점 (뽑기)</button>
            </div>
        </div>

        <!-- GARAGE SCREEN -->
        <div id="screen-garage" class="screen hidden interactive">
            <h2 style="margin-bottom: 15px;">팽이 커스터마이징</h2>
            <div class="garage-container">
                <div class="garage-left">
                    <h3>현재 스탯</h3>
                    <div style="margin-top: 15px;">
                        <div class="stat-bar-container">
                            <div class="stat-label"><span>공격력 (ATK)</span><span id="st-atk">0</span></div>
                            <div class="stat-bar"><div class="stat-fill" id="sb-atk"></div></div>
                        </div>
                        <div class="stat-bar-container">
                            <div class="stat-label"><span>방어력 (DEF)</span><span id="st-def">0</span></div>
                            <div class="stat-bar"><div class="stat-fill" id="sb-def"></div></div>
                        </div>
                        <div class="stat-bar-container">
                            <div class="stat-label"><span>지구력 (STM)</span><span id="st-stm">0</span></div>
                            <div class="stat-bar"><div class="stat-fill" id="sb-stm"></div></div>
                        </div>
                        <div class="stat-bar-container">
                            <div class="stat-label"><span>기동성 (SPD)</span><span id="st-spd">0</span></div>
                            <div class="stat-bar"><div class="stat-fill" id="sb-spd"></div></div>
                        </div>
                        <div class="stat-bar-container">
                            <div class="stat-label"><span>중량 (WGT)</span><span id="st-wgt">0</span></div>
                            <div class="stat-bar"><div class="stat-fill" id="sb-wgt"></div></div>
                        </div>
                    </div>
                </div>
                <div class="garage-right">
                    <div class="part-category">
                        <button class="cat-btn active" onclick="switchCategory('cap')">캡</button>
                        <button class="cat-btn" onclick="switchCategory('head')">헤드</button>
                        <button class="cat-btn" onclick="switchCategory('middle')">미들</button>
                        <button class="cat-btn" onclick="switchCategory('bottom')">바텀</button>
                    </div>
                    <div class="parts-grid" id="parts-list"></div>
                </div>
            </div>
            <button class="btn-main btn-secondary" style="margin-top: 15px; width: 200px;" onclick="openScreen('screen-main')">메인으로</button>
        </div>

        <!-- SHOP SCREEN -->
        <div id="screen-shop" class="screen hidden interactive">
            <h2>파츠 상점</h2>
            <div class="gacha-box">
                <div class="gacha-card">
                    <h3>일반 뽑기</h3>
                    <p style="color:#aaa; font-size:0.85rem; margin:10px 0;">일반 ~ 에픽 파츠 등장</p>
                    <p style="color:#ffd700; font-weight:bold; margin-bottom:15px;">200 Gold</p>
                    <button class="btn-main" onclick="buyGacha('normal')">뽑기</button>
                </div>
                <div class="gacha-card">
                    <h3>고급 뽑기</h3>
                    <p style="color:#aaa; font-size:0.85rem; margin:10px 0;">레어 ~ 전설 파츠 등장</p>
                    <p style="color:#ffd700; font-weight:bold; margin-bottom:15px;">500 Gold</p>
                    <button class="btn-main" onclick="buyGacha('premium')">뽑기</button>
                </div>
            </div>
            <button class="btn-main btn-secondary" style="margin-top: 25px; width: 200px;" onclick="openScreen('screen-main')">메인으로</button>
        </div>

        <!-- LAUNCH OVERLAY -->
        <div id="overlay-launch" class="launch-overlay hidden">
            <h2 style="color:#00d2ff; text-shadow:0 0 10px #00d2ff;">SHOOTING TIMING</h2>
            <div class="gauge-bg">
                <div class="gauge-bar" id="launch-gauge"></div>
            </div>
            <button class="btn-main" style="width: 200px;" id="btn-shoot">SHOOT!</button>
        </div>

        <!-- IN-GAME HUD -->
        <div id="hud-game" class="hud hidden">
            <div class="player-stamina-container">
                <div style="font-size:0.8rem; color:#aaa;">PLAYER STAMINA</div>
                <div class="stamina-bar"><div class="stamina-fill" id="player-stm-fill"></div></div>
            </div>

            <!-- JOYSTICK & BOOST -->
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
            <button class="btn-boost" id="btn-boost">BOOST</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="screen-result" class="screen hidden interactive">
            <div class="result-box">
                <div class="rank-title" id="result-rank">1st Place</div>
                <p id="result-reward" style="font-size: 1.2rem; color:#ffd700; margin-bottom: 20px;">+500 Gold</p>
                <button class="btn-main" onclick="openScreen('screen-main')">확인</button>
            </div>
        </div>
    </div>

    <script>
        /* --- AUDIO SYNTHESIS --- */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'clash') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'boost') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'launch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        document.getElementById('sound-toggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
        });

        /* --- GAME DATA --- */
        const PARTS = {
            cap: [
                { id: 'c1', name: '기본 캡', atk: 2, def: 2, stm: 5, spd: 2, wgt: 2, rarity: 'common', color: 0x888888 },
                { id: 'c2', name: '어택 캡', atk: 6, def: 1, stm: 3, spd: 4, wgt: 2, rarity: 'rare', color: 0xff4444 },
                { id: 'c3', name: '가디언 캡', atk: 1, def: 7, stm: 6, spd: 1, wgt: 4, rarity: 'epic', color: 0x4488ff },
                { id: 'c4', name: '드래곤 캡', atk: 9, def: 4, stm: 7, spd: 6, wgt: 5, rarity: 'legendary', color: 0xffaa00 }
            ],
            head: [
                { id: 'h1', name: '원형 헤드', atk: 3, def: 4, stm: 6, spd: 3, wgt: 3, rarity: 'common', color: 0xaaaaaa },
                { id: 'h2', name: '스파이크 헤드', atk: 8, def: 2, stm: 4, spd: 5, wgt: 3, rarity: 'rare', color: 0xcc3333 },
                { id: 'h3', name: '아이언 방패', atk: 2, def: 9, stm: 7, spd: 1, wgt: 6, rarity: 'epic', color: 0x555577 },
                { id: 'h4', name: '발키리 링', atk: 10, def: 3, stm: 5, spd: 8, wgt: 4, rarity: 'legendary', color: 0x00e5ff }
            ],
            middle: [
                { id: 'm1', name: '경량 미들', atk: 2, def: 2, stm: 5, spd: 6, wgt: 2, rarity: 'common', color: 0x666666 },
                { id: 'm2', name: '중량 코어', atk: 4, def: 6, stm: 4, spd: 2, wgt: 8, rarity: 'rare', color: 0x886644 },
                { id: 'm3', name: '자이로 미들', atk: 3, def: 4, stm: 10, spd: 3, wgt: 5, rarity: 'epic', color: 0x33cc66 }
            ],
            bottom: [
                { id: 'b1', name: '플랫 바텀', atk: 4, def: 2, stm: 3, spd: 7, wgt: 2, rarity: 'common', color: 0x444444 },
                { id: 'b2', name: '볼 바텀', atk: 1, def: 5, stm: 9, spd: 2, wgt: 3, rarity: 'rare', color: 0x4466aa },
                { id: 'b3', name: '고무 축 바텀', atk: 7, def: 3, stm: 4, spd: 9, wgt: 2, rarity: 'epic', color: 0xaa3366 }
            ]
        };

        let userData = {
            gold: 1000,
            inventory: ['c1', 'h1', 'm1', 'b1'],
            equipped: { cap: 'c1', head: 'h1', middle: 'm1', bottom: 'b1' }
        };

        let selectedMode = '1v1';
        let selectedDiff = 'normal';
        let currentCategory = 'cap';

        /* --- UI FUNCTIONS --- */
        function updateGoldUI() {
            document.getElementById('gold-display').innerText = userData.gold;
        }

        function openScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'screen-garage') renderGarage();
        }

        function setMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('#mode-1v1, #mode-4p, #mode-boss').forEach(b => b.classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');
        }

        function setDiff(diff) {
            selectedDiff = diff;
            document.querySelectorAll('#diff-easy, #diff-normal, #diff-hard').forEach(b => b.classList.remove('active'));
            document.getElementById('diff-' + diff).classList.add('active');
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderGarage();
        }

        function getEquippedStats(equipped = userData.equipped) {
            let stats = { atk: 0, def: 0, stm: 0, spd: 0, wgt: 0 };
            for (let cat in equipped) {
                let p = PARTS[cat].find(x => x.id === equipped[cat]);
                if (p) {
                    stats.atk += p.atk;
                    stats.def += p.def;
                    stats.stm += p.stm;
                    stats.spd += p.spd;
                    stats.wgt += p.wgt;
                }
            }
            return stats;
        }

        function renderGarage() {
            let stats = getEquippedStats();
            document.getElementById('st-atk').innerText = stats.atk;
            document.getElementById('st-def').innerText = stats.def;
            document.getElementById('st-stm').innerText = stats.stm;
            document.getElementById('st-spd').innerText = stats.spd;
            document.getElementById('st-wgt').innerText = stats.wgt;

            document.getElementById('sb-atk').style.width = (stats.atk * 3) + '%';
            document.getElementById('sb-def').style.width = (stats.def * 3) + '%';
            document.getElementById('sb-stm').style.width = (stats.stm * 3) + '%';
            document.getElementById('sb-spd').style.width = (stats.spd * 3) + '%';
            document.getElementById('sb-wgt').style.width = (stats.wgt * 3) + '%';

            let list = document.getElementById('parts-list');
            list.innerHTML = '';
            PARTS[currentCategory].forEach(p => {
                let owned = userData.inventory.includes(p.id);
                let isEquipped = userData.equipped[currentCategory] === p.id;

                let card = document.createElement('div');
                card.className = `part-card ${isEquipped ? 'equipped' : ''}`;
                card.style.opacity = owned ? '1' : '0.4';
                card.innerHTML = `
                    <div style="font-weight:bold; font-size:0.85rem;">${p.name}</div>
                    <div class="rarity rarity-${p.rarity}">${p.rarity.toUpperCase()}</div>
                `;
                if (owned) {
                    card.onclick = () => {
                        userData.equipped[currentCategory] = p.id;
                        renderGarage();
                    };
                }
                list.appendChild(card);
            });
        }

        function buyGacha(type) {
            let cost = type === 'normal' ? 200 : 500;
            if (userData.gold < cost) {
                alert('골드가 부족합니다!');
                return;
            }
            userData.gold -= cost;
            updateGoldUI();

            let pool = [];
            let rarities = type === 'normal' ? ['common', 'rare', 'epic'] : ['rare', 'epic', 'legendary'];

            for (let cat in PARTS) {
                PARTS[cat].forEach(p => {
                    if (rarities.includes(p.rarity)) pool.push(p);
                });
            }

            let rolled = pool[Math.floor(Math.random() * pool.length)];
            if (!userData.inventory.includes(rolled.id)) {
                userData.inventory.push(rolled.id);
                alert(`축하합니다! [${rolled.name}] 파츠를 획득했습니다!`);
            } else {
                userData.gold += Math.floor(cost * 0.5);
                updateGoldUI();
                alert(`이미 보유한 파츠 [${rolled.name}] 입니다. 환급액 +${Math.floor(cost * 0.5)} Gold`);
            }
        }

        /* --- THREE.JS BATTLE ENGINE --- */
        let scene, camera, renderer;
        let arenaMesh;
        let spinners = [];
        let isGaming = false;
        let launchGaugeVal = 0;
        let launchGaugeDir = 1;
        let gaugeAnimId = null;

        // JOYSTICK CONTROLS
        let joyDir = { x: 0, y: 0 };
        let joyActive = false;
        let keys = { w: false, a: false, s: false, d: false };

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c14);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 45);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // LIGHTS
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createArena();

            window.addEventListener('resize', onWindowResize);
            setupInputEvents();
        }

        function createArena() {
            const radius = 28;
            const segments = 64;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const uvs = [];

            for (let i = 0; i <= segments; i++) {
                const r = (i / segments) * radius;
                const y = Math.pow(r / radius, 2) * 3.5 - 0.8;

                for (let j = 0; j <= segments; j++) {
                    const theta = (j / segments) * Math.PI * 2;
                    const x = r * Math.cos(theta);
                    const z = r * Math.sin(theta);

                    positions.push(x, y, z);
                    uvs.push(i / segments, j / segments);
                }
            }

            const indices = [];
            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < segments; j++) {
                    const p1 = i * (segments + 1) + j;
                    const p2 = p1 + (segments + 1);

                    indices.push(p1, p2, p1 + 1);
                    indices.push(p1 + 1, p2, p2 + 1);
                }
            }

            geom.setIndex(indices);
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geom.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({
                color: 0x1a2138,
                roughness: 0.3,
                metalness: 0.6,
                wireframe: false
            });

            arenaMesh = new THREE.Mesh(geom, mat);
            arenaMesh.receiveShadow = true;
            scene.add(arenaMesh);

            const ringGeom = new THREE.RingGeometry(radius - 0.3, radius, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055, side: THREE.DoubleSide });
            const ringMesh = new THREE.Mesh(ringGeom, ringMat);
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = 2.72;
            scene.add(ringMesh);
        }

        function createSpinnerMesh(parts) {
            const group = new THREE.Group();

            const capGeom = new THREE.CylinderGeometry(0.5, 0.7, 0.4, 16);
            const capMat = new THREE.MeshStandardMaterial({ color: PARTS.cap.find(x => x.id === parts.cap).color });
            const cap = new THREE.Mesh(capGeom, capMat);
            cap.position.y = 0.8;
            group.add(cap);

            const headGeom = new THREE.CylinderGeometry(1.6, 0.8, 0.6, 6);
            const headMat = new THREE.MeshStandardMaterial({ color: PARTS.head.find(x => x.id === parts.head).color, metalness: 0.8 });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 0.4;
            group.add(head);

            const midGeom = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
            const midMat = new THREE.MeshStandardMaterial({ color: PARTS.middle.find(x => x.id === parts.middle).color });
            const mid = new THREE.Mesh(midGeom, midMat);
            mid.position.y = 0.05;
            group.add(mid);

            const botGeom = new THREE.ConeGeometry(0.8, 0.6, 16);
            const botMat = new THREE.MeshStandardMaterial({ color: PARTS.bottom.find(x => x.id === parts.bottom).color });
            const bot = new THREE.Mesh(botGeom, botMat);
            bot.position.y = -0.3;
            bot.rotation.x = Math.PI;
            group.add(bot);

            group.scale.set(0.65, 0.65, 0.65);
            return group;
        }

        /* --- BATTLE LOGIC --- */
        function startBattle() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('overlay-launch').classList.remove('hidden');

            launchGaugeVal = 0;
            launchGaugeDir = 1;
            if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
            animateGauge();
        }

        function animateGauge() {
            launchGaugeVal += 2 * launchGaugeDir;
            if (launchGaugeVal >= 100 || launchGaugeVal <= 0) launchGaugeDir *= -1;
            document.getElementById('launch-gauge').style.width = launchGaugeVal + '%';
            gaugeAnimId = requestAnimationFrame(animateGauge);
        }

        document.getElementById('btn-shoot').onclick = () => {
            if (gaugeAnimId) cancelAnimationFrame(gaugeAnimId);
            document.getElementById('overlay-launch').classList.add('hidden');
            document.getElementById('hud-game').classList.remove('hidden');

            playSound('launch');
            initBattleEntities(launchGaugeVal / 100);
        };

        function initBattleEntities(powerRatio) {
            spinners.forEach(s => scene.remove(s.mesh));
            spinners = [];

            let pStats = getEquippedStats();
            let playerSpinner = {
                isPlayer: true,
                mesh: createSpinnerMesh(userData.equipped),
                pos: new THREE.Vector3(-6, 1, 0),
                vel: new THREE.Vector3(0, 0, 0),
                stats: pStats,
                maxStamina: (pStats.stm * 300) + 1200,
                stamina: ((pStats.stm * 300) + 1200) * (0.6 + powerRatio * 0.4),
                spinSpeed: 0.5,
                alive: true
            };
            scene.add(playerSpinner.mesh);
            spinners.push(playerSpinner);

            let count = selectedMode === '1v1' ? 1 : (selectedMode === '4p' ? 3 : 1);
            let diffMult = selectedDiff === 'easy' ? 0.7 : (selectedDiff === 'normal' ? 1.0 : 1.35);

            for (let i = 0; i < count; i++) {
                let aiParts = {
                    cap: getRandomPartId('cap'),
                    head: getRandomPartId('head'),
                    middle: getRandomPartId('middle'),
                    bottom: getRandomPartId('bottom')
                };
                let aiStats = getEquippedStats(aiParts);

                if (selectedMode === 'boss') {
                    aiStats = { atk: 18, def: 18, stm: 25, spd: 12, wgt: 20 };
                } else {
                    aiStats.atk *= diffMult;
                    aiStats.def *= diffMult;
                    aiStats.stm *= diffMult;
                }

                let angle = (i + 1) * ((Math.PI * 2) / (count + 1));
                let enemySpinner = {
                    isPlayer: false,
                    isBoss: selectedMode === 'boss',
                    mesh: createSpinnerMesh(aiParts),
                    pos: new THREE.Vector3(Math.cos(angle) * 8, 1, Math.sin(angle) * 8),
                    vel: new THREE.Vector3(0, 0, 0),
                    stats: aiStats,
                    maxStamina: (aiStats.stm * 300) + 1200,
                    stamina: (aiStats.stm * 300) + 1200,
                    spinSpeed: 0.5,
                    alive: true
                };

                if (selectedMode === 'boss') {
                    enemySpinner.mesh.scale.set(1.1, 1.1, 1.1);
                }

                scene.add(enemySpinner.mesh);
                spinners.push(enemySpinner);
            }

            isGaming = true;
        }

        function getRandomPartId(cat) {
            let arr = PARTS[cat];
            return arr[Math.floor(Math.random() * arr.length)].id;
        }

        /* --- JOYSTICK & INPUT EVENTS --- */
        function setupInputEvents() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');

            function handleMove(clientX, clientY) {
                const rect = zone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = clientX - centerX;
                let dy = clientY - centerY;
                let dist = Math.hypot(dx, dy);
                let maxDist = rect.width / 2;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joyDir.x = dx / maxDist;
                joyDir.y = dy / maxDist;
            }

            zone.addEventListener('touchstart', e => {
                joyActive = true;
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            });
            zone.addEventListener('touchmove', e => {
                if (joyActive) handleMove(e.touches[0].clientX, e.touches[0].clientY);
            });
            zone.addEventListener('touchend', () => {
                joyActive = false;
                joyDir = { x: 0, y: 0 };
                knob.style.transform = 'translate(-50%, -50%)';
            });

            zone.addEventListener('mousedown', e => {
                joyActive = true;
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', e => {
                if (joyActive) handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (joyActive) {
                    joyActive = false;
                    joyDir = { x: 0, y: 0 };
                    knob.style.transform = 'translate(-50%, -50%)';
                }
            });

            window.addEventListener('keydown', e => {
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
                if (e.key === ' ') doBoost();
            });
            window.addEventListener('keyup', e => {
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            });

            document.getElementById('btn-boost').onclick = doBoost;
        }

        function doBoost() {
            if (!isGaming) return;
            let player = spinners.find(s => s.isPlayer && s.alive);
            if (player && player.stamina > 200) {
                player.stamina -= 180;
                let moveVec = new THREE.Vector3(joyDir.x, 0, joyDir.y);
                if (keys.w) moveVec.z -= 1;
                if (keys.s) moveVec.z += 1;
                if (keys.a) moveVec.x -= 1;
                if (keys.d) moveVec.x += 1;

                if (moveVec.lengthSq() === 0) moveVec.set(0, 0, -1);
                moveVec.normalize().multiplyScalar(0.7);

                player.vel.add(moveVec);
                playSound('boost');
            }
        }

        /* --- GAME LOOP & PHYSICS --- */
        function updatePhysics() {
            if (!isGaming) return;

            let aliveSpinners = spinners.filter(s => s.alive);

            let player = spinners.find(s => s.isPlayer);
            if (!player.alive || aliveSpinners.length <= 1) {
                endBattle(player.alive ? 1 : aliveSpinners.length + 1);
                return;
            }

            document.getElementById('player-stm-fill').style.width = Math.max(0, (player.stamina / player.maxStamina) * 100) + '%';

            aliveSpinners.forEach((s, idx) => {
                s.stamina -= 0.6;
                if (s.stamina <= 0) {
                    s.alive = false;
                    scene.remove(s.mesh);
                    return;
                }

                let accel = new THREE.Vector3();
                if (s.isPlayer) {
                    if (joyDir.x !== 0 || joyDir.y !== 0) {
                        accel.x += joyDir.x;
                        accel.z += joyDir.y;
                    }
                    if (keys.w) accel.z -= 1;
                    if (keys.s) accel.z += 1;
                    if (keys.a) accel.x -= 1;
                    if (keys.d) accel.x += 1;
                } else {
                    let target = null;
                    let minDist = 999;
                    aliveSpinners.forEach(other => {
                        if (other !== s) {
                            let d = s.pos.distanceTo(other.pos);
                            if (d < minDist) {
                                minDist = d;
                                target = other;
                            }
                        }
                    });
                    if (target) {
                        accel.subVectors(target.pos, s.pos).normalize();
                    }
                }

                if (accel.lengthSq() > 0) {
                    accel.normalize().multiplyScalar((s.stats.spd * 0.002) + 0.012);
                    s.vel.add(accel);
                }

                // 부드러운 중앙 복원력 (가만히 있으면 제자리로 돌아오고 미끄러지지 않도록 미세 조정)
                let distFromCenter = Math.hypot(s.pos.x, s.pos.z);
                if (distFromCenter > 3.0) {
                    let pullStrength = Math.pow(distFromCenter / 28, 1.5) * 0.008;
                    s.vel.x -= (s.pos.x / distFromCenter) * pullStrength;
                    s.vel.z -= (s.pos.z / distFromCenter) * pullStrength;
                }

                // 마찰력 대폭 강화 (0.90 -> 미끄러짐 방지)
                s.vel.multiplyScalar(0.90);

                s.pos.add(s.vel);

                let currentR = Math.hypot(s.pos.x, s.pos.z);
                let currentY = Math.pow(currentR / 28, 2) * 3.5 - 0.5;
                s.mesh.position.set(s.pos.x, currentY, s.pos.z);

                s.mesh.rotation.y += (s.stamina / s.maxStamina) * 0.5 + 0.1;

                // 링아웃 판정 (외곽 28.5 초과 시 탈락)
                if (currentR > 28.5) {
                    s.alive = false;
                    scene.remove(s.mesh);
                    playSound('clash');
                }

                // COLLISIONS
                for (let j = idx + 1; j < aliveSpinners.length; j++) {
                    let other = aliveSpinners[j];
                    let dist = s.pos.distanceTo(other.pos);
                    let minDist = 2.0;

                    if (dist < minDist) {
                        let normal = new THREE.Vector3().subVectors(s.pos, other.pos).normalize();
                        let relativeVel = new THREE.Vector3().subVectors(s.vel, other.vel);
                        let speed = relativeVel.length();

                        let force = (speed * 0.5) + (s.stats.atk * 0.02) + (other.stats.atk * 0.02) + 0.1;
                        
                        s.vel.addScaledVector(normal, force / (s.stats.wgt * 0.2 + 1));
                        other.vel.addScaledVector(normal, -force / (other.stats.wgt * 0.2 + 1));

                        let dmg = (force * 150) + (s.stats.atk * 10);
                        s.stamina -= dmg / (s.stats.def * 0.5 + 1);
                        other.stamina -= dmg / (other.stats.def * 0.5 + 1);

                        let overlap = minDist - dist;
                        s.pos.addScaledVector(normal, overlap * 0.5);
                        other.pos.addScaledVector(normal, -overlap * 0.5);

                        playSound('clash');
                    }
                }
            });
        }

        function endBattle(rank) {
            isGaming = false;
            document.getElementById('hud-game').classList.add('hidden');

            let reward = 0;
            if (rank === 1) reward = selectedMode === 'boss' ? 800 : 500;
            else if (rank === 2) reward = 250;
            else if (rank === 3) reward = 100;
            else reward = 30;

            userData.gold += reward;
            updateGoldUI();

            document.getElementById('result-rank').innerText = rank === 1 ? '🥇 VICTORY!' : `${rank}rd Place`;
            document.getElementById('result-reward').innerText = `+${reward} Gold`;

            openScreen('screen-result');
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowRegistry() {}
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initThree();
            updateGoldUI();
            animate();
        };
    </script>
</body>
</html>
